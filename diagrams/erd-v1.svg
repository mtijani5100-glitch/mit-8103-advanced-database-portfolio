e FK → ACCOUNTS</text><line x1="570" y1="835.0" x2="960" y2="835.0" stroke="#eef2f7" stroke-width="1"/><rect x="572" y="830.0" width="34" height="17" rx="4" fill="#f1f5f9" stroke="#dbe3ec"/><text x="589" y="842.0" text-anchor="middle" class="tag">FK</text><text x="616" y="843.0" class="field">destination_account_id</text><text x="616" y="857.0" class="detail">Nullable FK → ACCOUNTS</text><line x1="570" y1="868.0" x2="960" y2="868.0" stroke="#eef2f7" stroke-width="1"/><rect x="572" y="863.0" width="34" height="17" rx="4" fill="#f1f5f9" stroke="#dbe3ec"/><text x="589" y="875.0" text-anchor="middle" class="tag">FK</text><text x="616" y="876.0" class="field">reversal_of_transaction_id</text><text x="616" y="890.0" class="detail">Nullable self-FK</text><line x1="570" y1="901.0" x2="960" y2="901.0" stroke="#eef2f7" stroke-width="1"/><text x="577" y="909.0" class="field">created_at</text><text x="577" y="923.0" class="detail">TIMESTAMPTZ NOT NULL</text><g filter="url(#shadow)"><rect x="1100" y="620" width="390" height="320" rx="9" fill="#fff" stroke="#334155" stroke-width="1.4"/><path d="M1109,620 H1481 Q1490,620 1490,629 V663 H1100 V629 Q1100,620 1109,620 Z" fill="#F8DEDE"/><text x="1295.0" y="647" class="head" text-anchor="middle">LEDGER_ENTRIES</text><line x1="1100" y1="663" x2="1490" y2="663" stroke="#334155" stroke-width="1"/></g><rect x="1112" y="669.0" width="34" height="17" rx="4" fill="#f1f5f9" stroke="#dbe3ec"/><text x="1129" y="681.0" text-anchor="middle" class="tag">PK</text><text x="1156" y="682.0" class="field">entry_id</text><text x="1156" y="696.0" class="detail">BIGINT identity</text><line x1="1110" y1="711.8571428571429" x2="1480" y2="711.8571428571429" stroke="#eef2f7" stroke-width="1"/><rect x="1112" y="706.8571428571429" width="34" height="17" rx="4" fill="#f1f5f9" stroke="#dbe3ec"/><text x="1129" y="718.8571428571429" text-anchor="middle" class="tag">FK</text><text x="1156" y="719.8571428571429" class="field">transaction_id</text><text x="1156" y="733.8571428571429" class="detail">NOT NULL → TRANSACTIONS</text><line x1="1110" y1="749.7142857142857" x2="1480" y2="749.7142857142857" stroke="#eef2f7" stroke-width="1"/><rect x="1112" y="744.7142857142857" width="34" height="17" rx="4" fill="#f1f5f9" stroke="#dbe3ec"/><text x="1129" y="756.7142857142857" text-anchor="middle" class="tag">FK</text><text x="1156" y="757.7142857142857" class="field">account_id</text><text x="1156" y="771.7142857142857" class="detail">NOT NULL → ACCOUNTS</text><line x1="1110" y1="787.5714285714286" x2="1480" y2="787.5714285714286" stroke="#eef2f7" stroke-width="1"/><text x="1117" y="795.5714285714286" class="field">entry_type</text><text x="1117" y="809.5714285714286" class="detail">DEBIT / CREDIT</text><line x1="1110" y1="825.4285714285714" x2="1480" y2="825.4285714285714" stroke="#eef2f7" stroke-width="1"/><text x="1117" y="833.4285714285714" class="field">amount</text><text x="1117" y="847.4285714285714" class="detail">NUMERIC(19,2), must be &gt; 0</text><line x1="1110" y1="863.2857142857142" x2="1480" y2="863.2857142857142" stroke="#eef2f7" stroke-width="1"/><text x="1117" y="871.2857142857142" class="field">entry_timestamp</text><text x="1117" y="885.2857142857142" class="detail">TIMESTAMPTZ NOT NULL</text><line x1="1110" y1="901.1428571428571" x2="1480" y2="901.1428571428571" stroke="#eef2f7" stroke-width="1"/><text x="1117" y="909.1428571428571" class="field">description</text><text x="1117" y="923.1428571428571" class="detail">Optional explanatory text</text><g filter="url(#shadow)"><rect x="50" y="590" width="360" height="315" rx="9" fill="#fff" stroke="#334155" stroke-width="1.4"/><path d="M59,590 H401 Q410,590 410,599 V633 H50 V599 Q50,590 59,590 Z" fill="#E9E1F7"/><text x="230.0" y="617" class="head" text-anchor="middle">AUDIT_LOGS</text><line x1="50" y1="633" x2="410" y2="633" stroke="#334155" stroke-width="1"/></g><rect x="62" y="639.0" width="34" height="17" rx="4" fill="#f1f5f9" stroke="#dbe3ec"/><text x="79" y="651.0" text-anchor="middle" class="tag">PK</text><text x="106" y="652.0" class="field">audit_id</text><text x="106" y="666.0" class="detail">BIGINT identity</text><line x1="60" y1="676.5" x2="400" y2="676.5" stroke="#eef2f7" stroke-width="1"/><rect x="62" y="671.5" width="34" height="17" rx="4" fill="#f1f5f9" stroke="#dbe3ec"/><text x="79" y="683.5" text-anchor="middle" class="tag">FK?</text><text x="106" y="684.5" class="field">transaction_id</text><text x="106" y="698.5" class="detail">Nullable FK → TRANSACTIONS</text><line x1="60" y1="709.0" x2="400" y2="709.0" stroke="#eef2f7" stroke-width="1"/><text x="67" y="717.0" class="field">actor</text><text x="67" y="731.0" class="detail">NOT NULL</text><line x1="60" y1="741.5" x2="400" y2="741.5" stroke="#eef2f7" stroke-width="1"/><text x="67" y="749.5" class="field">action</text><text x="67" y="763.5" class="detail">NOT NULL</text><line x1="60" y1="774.0" x2="400" y2="774.0" stroke="#eef2f7" stroke-width="1"/><text x="67" y="782.0" class="field">entity_type</text><text x="67" y="796.0" class="detail">NOT NULL</text><line x1="60" y1="806.5" x2="400" y2="806.5" stroke="#eef2f7" stroke-width="1"/><text x="67" y="814.5" class="field">entity_id</text><text x="67" y="828.5" class="detail">Affected entity identifier</text><line x1="60" y1="839.0" x2="400" y2="839.0" stroke="#eef2f7" stroke-width="1"/><text x="67" y="847.0" class="field">event_details</text><text x="67" y="861.0" class="detail">JSONB or structured text</text><line x1="60" y1="871.5" x2="400" y2="871.5" stroke="#eef2f7" stroke-width="1"/><text x="67" y="879.5" class="field">created_at</text><text x="67" y="893.5" class="detail">TIMESTAMPTZ NOT NULL</text><g filter="url(#shadow)"><rect x="1030" y="975" width="460" height="175" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="1050" y="1002" class="noteTitle">MODELLING NOTES &amp; CONSTRAINTS</text>
<text x="1050" y="1025" class="noteText">• PK = primary key; FK = foreign key; UQ = unique.</text>
<text x="1050" y="1045" class="noteText">• CUSTOMER accounts have an owner; SETTLEMENT/SUSPENSE accounts may not.</text>
<text x="1050" y="1065" class="noteText">• Deposits/withdrawals balance through system ledger accounts.</text>
<text x="1050" y="1085" class="noteText">• Posted transactions require balanced ledger entries.</text>
<text x="1050" y="1105" class="noteText">• Reversals add compensating records; never erase history.</text>
<text x="1050" y="1125" class="noteText">• Reconcile cached balances against the ledger.</text></g><g><rect x="50" y="950" width="880" height="200" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="72" y="980" class="noteTitle">RELATIONSHIP SUMMARY</text>
<line x1="72" y1="1004" x2="128" y2="1004" stroke="#334155" stroke-width="2"/><text x="140" y="1009" class="noteText">Solid connector = required FK relationship</text>
<line x1="72" y1="1034" x2="128" y2="1034" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/><text x="140" y="1039" class="noteText">Dashed connector = optional relationship</text>
<text x="510" y="1009" class="noteText">CUSTOMERS 1 → 0..* CUSTOMER ACCOUNTS</text>
<text x="510" y="1034" class="noteText">CUSTOMER ACCOUNTS 1 → 0..* source/destination transactions</text>
<text x="510" y="1059" class="noteText">TRANSACTIONS 1 → 0..* LEDGER_ENTRIES</text>
<text x="510" y="1084" class="noteText">ACCOUNTS 1 → 0..* LEDGER_ENTRIES</text>
<text x="72" y="1084" class="noteText">Unique idempotency keys prevent duplicate request effects.</text>
<text x="72" y="1109" class="noteText">All records in this academic model use synthetic data.</text></g></svg>